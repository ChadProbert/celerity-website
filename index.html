<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Celerity: the keyboard-first new tab for Chrome</title>
    <meta
      name="description"
      content="Celerity replaces your new tab page with a minimal, keyboard-driven command launcher. Launch sites and search the web without lifting your hands from the keyboard."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9e9e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#222222" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getcelerity.app/" />
    <meta property="og:title" content="Celerity: the keyboard-first new tab for Chrome " />
    <meta
      property="og:description"
      content="A keyboard-first new tab for Chrome. Available now on Chrome Web Store."
    />
    <meta property="og:image" content="https://getcelerity.app/assets/celerity-showcase-dark-mode.png" />
    <meta property="og:image:width" content="2091" />
    <meta property="og:image:height" content="1174" />
    <meta property="og:image:alt" content="Celerity’s shortcut grid on a Chrome new tab, in dark and light themes." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" id="favicon" href="assets/tab-icon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="assets/tab-icon.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
    <link rel="preload" href="assets/poppins-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/poppins-medium.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Runs before first paint. A theme picked with the switch wins; otherwise
      // the page follows the system's light or dark mode.
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("celerity-theme");
        } catch {}
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <a class="brand" href="/" aria-label="Celerity home">
          <img class="mark-img mark-img--on-dark" src="assets/tab-icon.svg" width="243" height="139" alt="" />
          <img class="mark-img mark-img--on-light" src="assets/tab-icon-light.svg" width="243" height="139" alt="" />
          <span>Celerity</span>
        </a>

        <div class="top-actions">
          <a class="chip" href="https://github.com/ChadProbert/celerity" target="_blank" rel="noreferrer">
            <svg class="chip-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"
              />
            </svg>
            <span>Star on GitHub</span>
            <span class="chip-count" id="star-count" hidden></span>
          </a>

          <button class="theme-switch" type="button" id="theme-switch" aria-label="Switch to dark mode">
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 15.2A8.4 8.4 0 0 1 8.8 3.8 8.4 8.4 0 1 0 20.2 15.2Z" />
            </svg>
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.6" />
              <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
            </svg>
          </button>
        </div>
      </header>

      <main class="stage">
        <section class="hero" aria-labelledby="hero-title">
          <h1 id="hero-title">Type. Enter. There.</h1>
          <p class="sub">
            A minimal, keyboard-driven new tab for Chrome.
          </p>
          <p class="tagline">Built to disappear into your workflow</p>
          <div class="actions">
            <a class="button button--ink" href="https://github.com/ChadProbert/celerity" target="_blank" rel="noreferrer" data-install-link>
              <span data-install-label>Get Celerity</span>
            </a>
            <a class="button" href="https://github.com/ChadProbert/celerity" target="_blank" rel="noreferrer">
              <svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
                />
              </svg>
              <span>Contribute</span>
            </a>
          </div>
        </section>

        <figure class="shot">
          <img
            class="shot-img shot-img--dark"
            src="assets/celerity-showcase-dark-mode.webp"
            width="2091"
            height="1174"
            decoding="async"
            alt="Celerity on a Chrome new tab in Celerity Dark: a grid of twelve shortcuts, g for Gmail, c for Claude, y for YouTube, gh for GitHub and more, with the word Celerity below. A second window in Celerity Light sits behind it."
          />
          <img
            class="shot-img shot-img--light"
            src="assets/celerity-showcase-light-mode.webp"
            width="2095"
            height="1174"
            decoding="async"
            alt="Celerity on a Chrome new tab in Celerity Light: a grid of twelve shortcuts, g for Gmail, c for Claude, y for YouTube, gh for GitHub and more, with the word Celerity below. A second window in Celerity Dark sits behind it."
          />
        </figure>
      </main>

      <footer class="bottom-bar">
        <p>© <span id="year">2026</span> Celerity</p>
      </footer>
    </div>
  </body>
</html>
