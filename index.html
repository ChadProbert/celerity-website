<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Celerity: A Keyboard-First New Tab Extension</title>
    <meta
      name="description"
      content="Celerity replaces your new tab page with a minimal, keyboard-driven command launcher. Launch sites and search the web without lifting your hands from the keyboard."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9e9e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#222222" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getcelerity.app/" />
    <meta property="og:title" content="Celerity: A Keyboard-First New Tab Extension" />
    <meta property="og:description" content="A minimal, keyboard-driven new tab extension." />
    <meta property="og:image" content="https://getcelerity.app/assets/celerity-showcase-dark-mode.png" />
    <meta property="og:image:width" content="2091" />
    <meta property="og:image:height" content="1174" />
    <meta property="og:image:alt" content="Celerity's shortcut grid on a Chrome new tab, in dark and light themes." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" id="favicon" href="assets/tab-icon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="assets/tab-icon.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />

    <link rel="preload" href="assets/poppins-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/poppins-medium.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("celerity-theme");
        } catch {}
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <button class="theme-switch" type="button" id="theme-switch" aria-label="Switch to dark mode">
      <svg class="theme-icon light-only" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.2 15.2A8.4 8.4 0 0 1 8.8 3.8 8.4 8.4 0 1 0 20.2 15.2Z" />
      </svg>
      <svg class="theme-icon dark-only" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.6" />
        <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
      </svg>
    </button>

    <main class="page">
      <div class="brand">
        <div class="wordmark">
          <svg class="app-icon" viewBox="-3 -3 249 145" aria-hidden="true">
            <path d="M46 5H238M5 72H154M34 134H238" />
          </svg>
          <h1>Celerity</h1>
        </div>
        <p class="pitch">A minimal, keyboard-driven new tab for Chrome.</p>

        <div class="install">
          <a class="button" href="https://github.com/ChadProbert/celerity" target="_blank" rel="noreferrer">Add to Chrome</a>
          <p class="release">v<span id="version">1.0.0</span></p>
        </div>
      </div>

      <img
        class="showcase dark-only"
        src="assets/celerity-showcase-dark-mode.webp"
        width="2091"
        height="1174"
        fetchpriority="high"
        decoding="async"
        alt="Celerity on a Chrome new tab in Celerity Dark: a grid of twelve shortcuts, g for Gmail, c for Claude, y for YouTube, gh for GitHub and more, with the word Celerity below. A second window in Celerity Light sits behind it."
      />
      <img
        class="showcase light-only"
        src="assets/celerity-showcase-light-mode.webp"
        width="2095"
        height="1174"
        fetchpriority="high"
        decoding="async"
        alt="Celerity on a Chrome new tab in Celerity Light: a grid of twelve shortcuts, g for Gmail, c for Claude, y for YouTube, gh for GitHub and more, with the word Celerity below. A second window in Celerity Dark sits behind it."
      />

      <nav class="project" aria-label="Project">
        <ul class="links">
          <li>
            <a class="link" href="https://ko-fi.com/chadprobert" target="_blank" rel="noreferrer">
              <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20.2 4.9 13.1a4.6 4.6 0 0 1 6.5-6.5l.6.6.6-.6a4.6 4.6 0 0 1 6.5 6.5Z" />
              </svg>
              Support
            </a>
          </li>
          <li>
            <a class="link" href="https://github.com/ChadProbert/celerity" target="_blank" rel="noreferrer">
              <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 7 3 12l5 5M16 7l5 5-5 5M13.5 5l-3 14" />
              </svg>
              Contribute
            </a>
          </li>
          <li>
            <!-- Replace url once Mintlify has been setup -->
            <a class="link" href="https://github.com/ChadProbert/celerity/" target="_blank" rel="noreferrer">
              <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 6.5C10.5 5.3 8.4 4.5 3 4.5v13c5.4 0 7.5.8 9 2 1.5-1.2 3.6-2 9-2v-13c-5.4 0-7.5.8-9 2Zm0 0v13" />
              </svg>
              Wiki
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
