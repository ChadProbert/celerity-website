<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Celerity: New Tab Chrome Extension</title>
    <meta
      name="description"
      content="Celerity is a free, open-source new tab extension for Chrome. Open sites and search YouTube, GitHub and more with custom keyboard shortcuts."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9e9e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#222222" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getcelerity.app/" />
    <meta property="og:title" content="Celerity: New Tab Chrome Extension" />
    <meta property="og:description" content="Your shortcut to a faster, more efficient browsing experience." />
    <meta property="og:image" content="https://getcelerity.app/assets/celerity-showcase-dark-mode.png" />
    <meta property="og:image:width" content="2091" />
    <meta property="og:image:height" content="1174" />
    <meta property="og:image:alt" content="Celerity's shortcut grid on a Chrome new tab, in dark and light themes." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" id="favicon" href="assets/tab-icon-light.png" type="image/png" sizes="192x192" />

    <link rel="preload" href="assets/poppins-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/poppins-medium.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Set the theme before first paint so the page never flashes the wrong colours
      let theme = null;
      try {
        theme = localStorage.getItem("theme");
      } catch {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <main class="page">
      <div class="brand">
        <div class="wordmark">
          <svg class="app-icon" viewBox="-3 -3 249 145" aria-hidden="true">
            <path d="M46 5H238M5 72H154M34 134H238" />
          </svg>
          <h1>Celerity</h1>
        </div>
        <p class="pitch">Your shortcut to a faster, more efficient browsing experience.</p>

        <nav class="project" aria-label="Project">
          <ul class="links">
            <li>
              <a class="link" href="https://ko-fi.com/chadprobert" target="_blank" rel="noreferrer">
                <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 20.2 4.9 13.1a4.6 4.6 0 0 1 6.5-6.5l.6.6.6-.6a4.6 4.6 0 0 1 6.5 6.5Z" />
                </svg>
                Support
              </a>
            </li>
            <li>
              <a class="link" href="https://github.com/ChadProbert/celerity" target="_blank" rel="noreferrer">
                <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 7 3 12l5 5M16 7l5 5-5 5M13.5 5l-3 14" />
                </svg>
                Contribute
              </a>
            </li>
            <li>
              <a class="link" href="https://celerity-wiki.mintlify.site/" target="_blank" rel="noreferrer">
                <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 6.5C10.5 5.3 8.4 4.5 3 4.5v13c5.4 0 7.5.8 9 2 1.5-1.2 3.6-2 9-2v-13c-5.4 0-7.5.8-9 2Zm0 0v13" />
                </svg>
                Wiki
              </a>
            </li>
            <li>
              <button class="link theme-toggle" id="theme-toggle" type="button">
                <span class="theme-option theme-option-dark">
                  <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z" />
                  </svg>
                  Dark mode
                </span>
                <span class="theme-option theme-option-light">
                  <svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                    />
                  </svg>
                  Light mode
                </span>
              </button>
            </li>
          </ul>
        </nav>
      </div>

      <a
        class="showcase"
        id="showcase"
        href="assets/celerity-showcase-light-mode.webp"
        target="_blank"
        rel="noopener"
      >
        <picture>
          <source
            media="(prefers-color-scheme: dark)"
            srcset="assets/celerity-showcase-dark-mode.webp"
            width="2091"
            height="1174"
          />
          <img
            src="assets/celerity-showcase-light-mode.webp"
            width="2095"
            height="1174"
            fetchpriority="high"
            decoding="async"
            alt="A showcase of Celerity's interface."
          />
        </picture>
      </a>

      <div class="install">
        <a class="button" href="https://github.com/ChadProbert/celerity" target="_blank" rel="noreferrer">Add to Chrome</a>
        <p class="release">v<span id="version">1.0.0</span></p>
      </div>
    </main>
  </body>
</html>
